name: GrowthLetters
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.growthletters
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  GrowthLetters:
    type: application
    platform: iOS
    sources: [GrowthLetters, Shared]
    dependencies:
      - sdk: libsqlite3.tbd
      - target: GrowthLettersWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GrowthLetters AppStore
    entitlements:
      path: GrowthLetters/GrowthLetters.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.growthletters]
    info:
      path: GrowthLetters/Info.plist
      properties:
        CFBundleDisplayName: Letters to My Child
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.growthletters.open
            CFBundleURLSchemes: [growthletters]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Family Letter
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.growthletter]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.growthletter
            UTTypeDescription: Family Letter
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [growthletter]
  GrowthLettersWidget:
    type: app-extension
    platform: iOS
    sources:
      - GrowthLettersWidget
      - path: Shared
        includes: [L10n.swift, Localizable.xcstrings, WidgetSnapshot.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: GrowthLetters Widget AppStore
    entitlements:
      path: GrowthLettersWidget/GrowthLettersWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.growthletters]
    info:
      path: GrowthLettersWidget/Info.plist
      properties:
        CFBundleDisplayName: Letters to My Child
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  GrowthLettersTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GrowthLettersTests, Shared]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  GrowthLettersUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GrowthLettersUITests]
    dependencies:
      - target: GrowthLetters
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GrowthLetters
schemes:
  GrowthLetters:
    build:
      targets:
        GrowthLetters: all
        GrowthLettersTests: [test]
    test:
      config: Debug
      targets: [GrowthLettersTests]
  GrowthLettersUI:
    build:
      targets:
        GrowthLetters: all
        GrowthLettersUITests: [test]
    test:
      config: Debug
      targets: [GrowthLettersUITests]
